<!-- Drawn whole from the first frame, on the server too (2026-10): frame, bubbles, "POINTS" and the
     progress track. Only the number fills in once the summary loads, into a reserved slot, so the
     badge never changes size. See BubbleBadgeComponent.placeholder. -->
<ng-container *ngIf="(summary ?? placeholder) as shown">
  <button
    *ngIf="shown.pointsSystemEnabled"
    class="bubble-badge"
    (click)="goToRewards()"
    (mouseenter)="showTooltip = true"
    (mouseleave)="showTooltip = false"
    [attr.aria-label]="summary ? 'Bubble Rewards: ' + summary.points + ' points' : 'Bubble Rewards'"
  >
    <div class="bubble-badge__inner">
      <!-- CSS realistic bubble cluster -->
      <div class="bb-cluster">
        <span class="bb-bubble bb-bubble--lg"></span>
        <span class="bb-bubble bb-bubble--md"></span>
        <span class="bb-bubble bb-bubble--sm"></span>
      </div>

      <div class="bubble-badge__info">
        <span class="bubble-badge__points">{{ summary ? (summary.points | number) : '' }}</span>
        <span class="bubble-badge__tier">Points</span>
      </div>
    </div>

    <!-- Glowing progress bar -->
    <div class="bubble-badge__bar">
      <div class="bubble-badge__bar-fill" [style.width.%]="shown.tierProgressPercent"></div>
    </div>

    <!-- Tooltip (desktop only) -->
    <div class="bubble-badge__tooltip" *ngIf="showTooltip && summary">
      <div class="tooltip-tier">{{ shown.tier === 'UltraBubble' ? 'Ultra Bubble' : shown.tier === 'SuperBubble' ? 'Super Bubble' : 'Bubble' }}</div>
      <div class="tooltip-progress" *ngIf="shown.nextTierName">{{ shown.tierProgressPercent }}% to {{ shown.nextTierName }}</div>
      <div class="tooltip-credits" *ngIf="shown.credits > 0">${{ shown.credits | number:'1.2-2' }} credit</div>
      <div class="tooltip-link">View Rewards →</div>
    </div>
  </button>
</ng-container>
