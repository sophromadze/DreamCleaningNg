@if (variant === 'inline') {
  <div class="service-area-map-wrapper">
    <div class="search-section">
      <div class="search-row">
        <input
          type="text"
          class="search-input"
          [(ngModel)]="searchZip"
          placeholder="Enter your ZIP code to check coverage"
          maxlength="5"
          (keydown.enter)="onSearch()"
        />
        <button type="button" class="search-btn" (click)="onSearch()">Search</button>
      </div>
      @if (searchMessage) {
        <p [class]="messageClass">{{ searchMessage }}</p>
      }
    </div>
    <div #mapContainer class="map-container"></div>
  </div>
} @else {
  <div class="sticky-coverage" [class.docked]="isDocked" [class.expanded]="isExpanded">
    <div class="sticky-map-sheet" [class.open]="isExpanded">
      <div class="sheet-header">
        <span class="sheet-title">Are we in your area?</span>
        <button type="button" class="sheet-close" (click)="collapse()" aria-label="Close map">×</button>
      </div>
      <div #mapContainer class="map-container"></div>
    </div>
    <div class="sticky-bar">
      <div class="search-row">
        <input
          type="text"
          class="search-input"
          [(ngModel)]="searchZip"
          placeholder="Enter your ZIP code to check coverage"
          maxlength="5"
          (focus)="expand()"
          (keydown.enter)="onSearch()"
        />
        <button type="button" class="search-btn" (click)="onSearch()">Search</button>
      </div>
      @if (searchMessage) {
        <p [class]="messageClass">{{ searchMessage }}</p>
      }
    </div>
  </div>
}
