<!-- src/app/auth/admin/admin.component.html -->

<div class="admin-container">
  <div class="admin-header">
    <h1>Admin Panel</h1>
    <button
      *ngIf="userRole === 'SuperAdmin'"
      class="maintenance-btn"
      [class.enabled]="maintenanceStatus?.isEnabled"
      (click)="confirmToggleMaintenance()"
      [disabled]="isTogglingMaintenance">
      {{ maintenanceStatus?.isEnabled ? 'Stop Maintenance' : 'Start Maintenance' }}
    </button>
    <!-- Live-chat toggle — TEMPORARILY DISABLED. Telegram integration is off; re-enable when bot is back. -->
    <!--
    <button
      *ngIf="userRole === 'Admin' || userRole === 'SuperAdmin'"
      class="chat-toggle-btn"
      [class.chat-toggle-btn--off]="!chatEnabled"
      (click)="toggleChat()"
      [disabled]="isTogglingChat">
      {{ chatEnabled ? '💬 Disable Chat' : '💬 Enable Chat' }}
    </button>
    -->

    <!-- AI chat agent settings popover (visibility + escalation email).
         Role-gated to match the backend's [Authorize(Roles = "SuperAdmin,Admin")] —
         deliberately NOT the canView permission, which Moderators can hold. -->
    <app-chat-agent-settings *ngIf="userRole === 'Admin' || userRole === 'SuperAdmin'"></app-chat-agent-settings>
  </div>

  <!-- Tab Navigation -->
  <div class="admin-tabs">
    <button class="tab-btn" 
            [class.active]="activeTab === 'orders'"
            (click)="setActiveTab('orders')"
            *ngIf="userPermissions?.permissions?.canView">
      Orders
    </button>
    <button class="tab-btn" 
            [class.active]="activeTab === 'users'"
            (click)="setActiveTab('users')"
            *ngIf="userPermissions?.permissions?.canView">
      Users
    </button>
    <!-- The cleaner LOGIN ACCOUNTS and which cleaner record each one drives. Renamed to
         "Cleaners" by the owner (2026-09); the people themselves - documents, ranking, wages -
         stay on the separate /cleaners-dashboard page. The tab KEY stays cleaner-accounts: it is
         persisted in sessionStorage, so renaming it would bounce every admin mid-session back to
         Orders. Visible to any role holding View; Admins hold Update and do everything in it. -->
    <button class="tab-btn"
            [class.active]="activeTab === 'cleaner-accounts'"
            (click)="setActiveTab('cleaner-accounts')"
            *ngIf="userPermissions?.permissions?.canView">
      Cleaners
    </button>
    <!-- Services edits the price catalogue every quote is built from, so it is SuperAdmin-only —
         deliberately NOT canView, which regular Admins and Moderators hold. Matched by
         [Authorize(Roles = "SuperAdmin")] on the catalogue half of AdminCatalogController. -->
    <button class="tab-btn"
            [class.active]="activeTab === 'booking-services'"
            (click)="setActiveTab('booking-services')"
            *ngIf="userRole === 'SuperAdmin'">
      Services
    </button>
    <button class="tab-btn" 
            [class.active]="activeTab === 'discounts'"
            (click)="setActiveTab('discounts')"
            *ngIf="userPermissions?.permissions?.canView">
      Discounts
    </button>
    <button class="tab-btn"
            [class.active]="activeTab === 'scheduling'"
            (click)="setActiveTab('scheduling')"
            *ngIf="userPermissions?.permissions?.canView">
      Scheduling
    </button>
    <button class="tab-btn"
            [class.active]="activeTab === 'audit-history'"
            (click)="setActiveTab('audit-history')"
            *ngIf="userPermissions?.permissions?.canView">
      Audits
    </button>
    <button class="tab-btn"
            [class.active]="activeTab === 'mails-sms'"
            (click)="setActiveTab('mails-sms')"
            *ngIf="userPermissions?.permissions?.canView">
      Mails &amp; SMS
    </button>
    <button class="tab-btn"
            [class.active]="activeTab === 'before-after'"
            (click)="setActiveTab('before-after')"
            *ngIf="userPermissions?.permissions?.canView">
      Before &amp; After
    </button>
    <!-- Role-gated like the chat-agent settings popover (backend is SuperAdmin/Admin) —
         deliberately NOT canView, which Moderators can hold. -->
    <button class="tab-btn"
            [class.active]="activeTab === 'chats'"
            (click)="setActiveTab('chats')"
            *ngIf="userRole === 'Admin' || userRole === 'SuperAdmin'">
      Chats
    </button>
    <!-- Bubble Rewards MOVED here from the header dropdown (2026-09). SuperAdmin-only: the
         settings on it set the points economy every customer earns and spends against, so it is
         role-gated like Services, not canView-gated. Matched by [Authorize(Roles = "SuperAdmin")]
         on AdminRewardsController's settings and stats reads. -->
    <button class="tab-btn"
            [class.active]="activeTab === 'rewards'"
            (click)="setActiveTab('rewards')"
            *ngIf="userRole === 'SuperAdmin'">
      Rewards
    </button>
  </div>

  <!-- Messages -->
  <div class="error-message" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>
  <div class="success-message" *ngIf="successMessage">
    {{ successMessage }}
  </div>

  <!-- Tab Content -->
  <div class="tab-content">
    <ng-container [ngSwitch]="activeTab">
      <app-orders *ngSwitchCase="'orders'" [openOrderId]="pendingOrderId"></app-orders>
      <app-user-management *ngSwitchCase="'users'" [openUserId]="pendingUserId"></app-user-management>
      <app-cleaner-accounts *ngSwitchCase="'cleaner-accounts'"></app-cleaner-accounts>
      <!-- Guarded as well as hidden: a stale 'booking-services' in sessionStorage would otherwise
           mount the component (and fire its now-403 catalogue GETs) before the role has loaded.
           setActiveTab / the permission load move a non-SuperAdmin back to Orders. -->
      <ng-container *ngSwitchCase="'booking-services'">
        <app-booking-services *ngIf="userRole === 'SuperAdmin'"></app-booking-services>
      </ng-container>
      <app-discounts *ngSwitchCase="'discounts'" [initialSubTab]="selectedDiscountSubTab"></app-discounts>
      <app-scheduling *ngSwitchCase="'scheduling'"></app-scheduling>
      <app-audit-history *ngSwitchCase="'audit-history'"></app-audit-history>
      <app-communications *ngSwitchCase="'mails-sms'"></app-communications>
      <app-before-after-photos *ngSwitchCase="'before-after'"></app-before-after-photos>
      <app-chat-sessions *ngSwitchCase="'chats'" [userRole]="userRole"></app-chat-sessions>
      <!-- Guarded as well as hidden, same reason as Services above: a stale 'rewards' in
           sessionStorage would otherwise mount the component and fire its now-403 GETs before the
           role has loaded. -->
      <ng-container *ngSwitchCase="'rewards'">
        <app-admin-rewards *ngIf="userRole === 'SuperAdmin'"></app-admin-rewards>
      </ng-container>
    </ng-container>
  </div>
</div>
