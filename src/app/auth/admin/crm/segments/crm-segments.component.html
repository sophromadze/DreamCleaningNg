<div class="crm-segments">
  <p class="intro">Segments are computed live from order history, spend and subscriptions. Click a segment to see its customers.</p>

  <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="segments-grid" *ngIf="!loading">
    <button class="segment-card" *ngFor="let seg of segments"
            [ngClass]="segClass(seg.key)"
            [class.empty]="seg.count === 0"
            (click)="open(seg)">
      <div class="seg-count">{{ seg.count }}</div>
      <div class="seg-label">{{ seg.label }}</div>
      <div class="seg-desc">{{ seg.description }}</div>
      <div class="seg-value" *ngIf="seg.totalValue > 0">{{ seg.totalValue | currency:'USD':'symbol':'1.0-0' }} total value</div>
    </button>
  </div>

  <div class="loading-state" *ngIf="loading">Loading segments…</div>
</div>
