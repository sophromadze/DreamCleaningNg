<div class="company-container">
  <div class="company-header">
    <div class="company-title">
      <a routerLink="/admin" class="back-link">← Admin</a>
      <h1>Company</h1>
    </div>
  </div>

  <div class="company-tabs">
    @if (canView('statistics')) {
    <a class="company-tab"
       routerLink="statistics" routerLinkActive="active">Statistics</a>
    }
    @if (canView('expenses')) {
    <a class="company-tab"
       routerLink="expenses" routerLinkActive="active">Expenses</a>
    }
    @if (canView('finances')) {
    <a class="company-tab"
       routerLink="finances" routerLinkActive="active">Finances</a>
    }
    @if (canView('ads')) {
    <a class="company-tab"
       routerLink="ads" routerLinkActive="active">Ads</a>
    }
    @if (canView('traffic')) {
    <a class="company-tab"
       routerLink="traffic" routerLinkActive="active">Traffic</a>
    }
    @if (canView('keywords')) {
    <a class="company-tab"
       routerLink="keywords" routerLinkActive="active">Keywords</a>
    }
    @if (canView('customer-stats')) {
    <a class="company-tab"
       routerLink="customers" routerLinkActive="active">Customers</a>
    }
  </div>

  <div class="company-content">
    <router-outlet></router-outlet>
  </div>
</div>
