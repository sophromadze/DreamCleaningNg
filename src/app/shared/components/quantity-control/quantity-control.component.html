<div class="control-buttons" [class.control-buttons--extra]="variant === 'extra'">
  <button type="button" [disabled]="decrementDisabled" (click)="decrement.emit($event)">
    <svg width="12" height="2" viewBox="0 0 12 2" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="1" y1="1" x2="11" y2="1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <span>{{ value }}</span>
  <button type="button" [disabled]="incrementDisabled" (click)="increment.emit($event)">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="6" y1="1" x2="6" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <line x1="1" y1="6" x2="11" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</div>
