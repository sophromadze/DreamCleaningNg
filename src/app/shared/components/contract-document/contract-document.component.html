<article class="dc-document">
  <div class="dc-document-body" [innerHTML]="htmlBeforeSignatures"></div>

  <div class="dc-signature-grid" *ngIf="showSignatureBlock && parties.length">
    <div class="dc-signature-party" *ngFor="let party of parties">
      <div class="dc-signature-party-label">{{ party.partyLabel }}</div>
      <div class="dc-signature-entity">{{ party.entityName }}</div>

      <div class="dc-signature-mark" [class.signed]="party.hasSigned">
        <img *ngIf="party.hasSigned && isImageMark(party)"
             [src]="party.signatureMark" alt="Signature of {{ party.signerName }}" />
        <span class="dc-signature-typed"
              *ngIf="party.hasSigned && !isImageMark(party)">{{ party.signatureMark }}</span>
        <span class="dc-signature-pending" *ngIf="!party.hasSigned">Awaiting signature</span>
      </div>

      <div class="dc-signature-rule"></div>
      <div class="dc-signature-caption">Signature</div>

      <div class="dc-signature-value">{{ party.signerName || '—' }}</div>
      <div class="dc-signature-caption">Name</div>

      <div class="dc-signature-value">{{ party.signerTitle || '—' }}</div>
      <div class="dc-signature-caption">Title</div>

      <div class="dc-signature-timestamp" *ngIf="party.signedAt">
        Signed electronically {{ party.signedAt | date: 'medium' }}
      </div>
    </div>
  </div>

  <div class="dc-document-body" [innerHTML]="htmlAfterSignatures"></div>
</article>
