<div class="user-search-container">
  <div class="user-search-input-wrapper">
    <input
      type="text"
      class="user-search-input"
      [ngModel]="displayTerm"
      (ngModelChange)="onSearchInput($event)"
      placeholder="Search by name, email, or ID..."
      [readonly]="!!selectedUser">
    <button
      type="button"
      class="clear-user-btn"
      *ngIf="selectedUser"
      (click)="clearSelectedUser()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- User Dropdown -->
  <div class="user-dropdown" *ngIf="!selectedUser">
    <div *ngIf="isLoadingUsers" class="loading-users">
      Loading users...
    </div>
    <div *ngIf="!isLoadingUsers && filteredUsers.length === 0" class="no-users">
      No users found
    </div>
    <div class="users-list" *ngIf="!isLoadingUsers && filteredUsers.length > 0">
      <div
        class="user-item"
        *ngFor="let user of filteredUsers"
        (click)="selectUser(user)">
        <div class="user-info">
          <strong>{{ user.firstName }} {{ user.lastName }}</strong>
          <span class="user-email">{{ user.isNoEmailUser ? 'No email' : user.email }}</span>
          <span class="user-id">ID: {{ user.id }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
